<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高爾夫球社簽到</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      padding: 30px 15px;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000015;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #16865c;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>⛳ 高爾夫球社簽到</h2>
    <p id="status">正在初始化 LINE，請稍候……</p>

    <div id="form" hidden>
      <input id="name" placeholder="請輸入姓名">
      <input id="studentNo" placeholder="請輸入學號／社員編號">
      <button id="signIn">綁定並簽到</button>
    </div>
  </div>

  <script>
    const LIFF_ID = "2012179452-3SiWYXs6";

    async function start() {
      const status = document.getElementById("status");

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        status.textContent =
          "LINE 初始化成功！你好，" + profile.displayName;

        document.getElementById("form").hidden = false;

      } catch (err) {
        console.error(err);
        status.textContent =
          "初始化失敗：" + (err.message || String(err));
      }
    }

    start();
  </script>
</body>
</html>
